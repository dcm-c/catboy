    <header class="py-5 mt-5 text-center page-header">
        <div class="container">
            <h1 class="display-4 fw-bold">Közösségi Galéria 📸</h1>
            <p class="lead text-muted mx-auto" style="max-width: 600px;">
                A legjobb pillanatok, legcukibb outfitek és legmenőbb setupok tőletek, nektek!
                <br><span class="badge bg-pink text-pink mt-2">Kattints a képekre a nagyításhoz!</span>
            </p>
        </div>
    </header>

    <section class="pb-5">
        <div class="container">

            <div class="row justify-content-center mb-5">
                <div class="col-lg-10">
                    <div class="d-flex flex-wrap justify-content-center gap-2 filter-group">
                        <button class="btn btn-filter active" data-filter="all">Összes ✨</button>
                        <button class="btn btn-filter" data-filter="outfits">Outfitek 👗</button>
                        <button class="btn btn-filter" data-filter="events">Találkozók 🎉</button>
                        <button class="btn btn-filter" data-filter="politics">Politika 🍊</button>
                        <button class="btn btn-filter" data-filter="art">Art & Kreatív 🎨</button>
                        <button class="btn btn-filter" id="btn-reddit-filter" data-filter="reddit">Reddit Feed
                            🧡</button>
                    </div>
                </div>
            </div>
            <div class="row g-4" id="gallery-grid">
                <div class="col-12 col-sm-6 col-lg-4 gallery-col events">
                    <div class="photo-wrapper" data-bs-toggle="modal" data-bs-target="#imageModal"
                        data-img-src="imgs/con1.jpg" data-title="Kép a zászlónkal" data-author="Fembargo"
                        data-insta-url="https://www.instagram.com/fembargoo/">
                        <div class="blur-bg" style="background-image: url('imgs/thumbs/con1.webp');">
                        </div>
                        <img src="imgs/thumbs/con1.webp" decoding="async" class="main-photo" alt="Kép a zászlónkal" loading="lazy">
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-4 gallery-col politics">
                    <div class="photo-wrapper" data-bs-toggle="modal" data-bs-target="#imageModal"
                        data-img-src="imgs/pol1.jpeg" data-title="Femboyok a békemeneten" data-author="Fembargo & Maxie"
                        data-insta-url="https://www.instagram.com/fembargoo/">
                        <div class="blur-bg" style="background-image: url('imgs/thumbs/pol1.webp');">
                        </div>
                        <img src="imgs/thumbs/pol1.webp" decoding="async" class="main-photo" alt="Femboyok a békemeneten" loading="lazy">
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-4 gallery-col politics">
                    <div class="photo-wrapper" data-bs-toggle="modal" data-bs-target="#imageModal"
                        data-img-src="imgs/pol2.jpg" data-title="Hazaffy Legány" data-author="Fembargo"
                        data-insta-url="https://www.instagram.com/fembargoo/">
                        <div class="blur-bg" style="background-image: url('imgs/thumbs/pol2.webp');">
                        </div>
                        <img src="imgs/thumbs/pol2.webp" decoding="async" class="main-photo" alt="Hazaffy Legány" loading="lazy">
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-4 gallery-col events">
                    <div class="photo-wrapper" data-bs-toggle="modal" data-bs-target="#imageModal"
                        data-img-src="imgs/bar1.jpg" data-title="Con utáni event e-sport bar-ban" data-author="Fembargo"
                        data-insta-url="https://www.instagram.com/fembargoo/">
                        <div class="blur-bg" style="background-image: url('imgs/thumbs/bar1.webp');">
                        </div>
                        <img src="imgs/thumbs/bar1.webp" decoding="async" class="main-photo" alt="Con utáni event e-sport bar-ban" loading="lazy">
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-4 gallery-col events">
                    <div class="photo-wrapper" data-bs-toggle="modal" data-bs-target="#imageModal"
                        data-img-src="imgs/run.jpg" data-title="Közös futás az atlétikai stadion körül"
                        data-author="Fembargo" data-insta-url="https://www.instagram.com/fembargoo/">
                        <div class="blur-bg" style="background-image: url('imgs/thumbs/run.webp');">
                        </div>
                        <img src="imgs/thumbs/run.webp" decoding="async" class="main-photo" alt="Közös futás az atlétikai stadion körül" loading="lazy">
                    </div>
                </div>


            </div>
            <div id="reddit-loader-trigger" class="text-center py-5 mt-4">
                <div class="spinner-border text-pink" role="status" style="display: none;" id="reddit-spinner">
                    <span class="visually-hidden">Betöltés...</span>
                </div>
                <p class="text-muted small mt-2" id="reddit-status-text" style="display: none;">Reddit képek
                    betöltése...</p>
            </div>

                                <a href="#" target="_blank" id="modalInstaLink"

                                </a>
                            </div>
